<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Lemon Soft Market - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Noto Sans KR', sans-serif; }
    body { background-color: #fffdf7; display: flex; justify-content: center; align-items: center; height: 100vh; }

    .login-container {
        background: #fff;
        width: 100%;
        max-width: 400px;
        padding: 40px;
        border-radius: 40px;
        box-shadow: 0 10px 30px rgba(255, 249, 196, 0.5);
        border: 2px solid #FFF9C4;
        text-align: center;
    }

    .logo { font-size: 22px; font-weight: 700; color: #444; margin-bottom: 30px; letter-spacing: -1px; }

    /* 입력창 스타일 */
    .input-group { margin-bottom: 15px; text-align: left; }
    .input-group input {
        width: 100%;
        padding: 15px 20px;
        border-radius: 25px;
        border: 1.5px solid #eee;
        outline: none;
        transition: 0.3s;
        background-color: #fafafa;
    }
    .input-group input:focus { border-color: #FDD835; background-color: #fff; }

    /* 일반 로그인 버튼 */
    .btn-login {
        width: 100%;
        padding: 15px;
        border-radius: 25px;
        border: none;
        background-color: #FDD835;
        color: #444;
        font-weight: 700;
        cursor: pointer;
        margin-top: 10px;
        transition: 0.3s;
    }
    .btn-login:hover { background-color: #FBC02D; transform: translateY(-2px); }

    /* 소셜 로그인 버튼 (가로로 긴 스타일) */
    .social-section { margin-top: 30px; display: flex; flex-direction: column; gap: 10px; }
    .social-btn {
        width: 100%;
        padding: 12px;
        border-radius: 25px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
        transition: 0.2s;
    }
    .btn-kakao { background-color: #FEE500; color: #3c1e1e; }
    .btn-naver { background-color: #03C75A; color: #fff; }
    .btn-google { background-color: #fff; color: #444; border: 1px solid #ddd; }

    .social-btn:hover { opacity: 0.9; transform: scale(1.02); }

    .footer-links { margin-top: 20px; font-size: 13px; color: #999; }
    .footer-links a { color: #666; text-decoration: none; margin: 0 5px; }
  </style>
</head>
<body>

<div class="login-container">
  <div class="logo">LEMON SOFT MARKET</div>

  <form th:action="@{/login}" method="post">
    <div class="input-group">
      <input type="email" name="username" placeholder="이메일(ID)을 입력해주세요" required>
    </div>
    <div class="input-group">
      <input type="password" name="password" placeholder="비밀번호를 입력해주세요" required>
    </div>
    <button type="submit" class="btn-login">로그인</button>
  </form>

  <div class="social-section">
    <a th:href="@{/oauth2/authorization/kakao}" class="social-btn btn-kakao">카카오로 1초 시작하기</a>
    <a th:href="@{/oauth2/authorization/naver}" class="social-btn btn-naver">네이버로 시작하기</a>
    <a th:href="@{/oauth2/authorization/google}" class="social-btn btn-google">Google 계정으로 시작하기</a>
  </div>

  <div class="footer-links">
    <a th:href="@{/members/new}">회원가입</a> | <a href="#">비밀번호 찾기</a>
  </div>
</div>

</body>
</html>
