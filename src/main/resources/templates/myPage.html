<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Page - Wishlist</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Noto Sans KR', sans-serif; }
        body { background-color: #fffdf7; color: #444; }
        header {
            background-color: #FFF9C4;
            padding: 22px 28px;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            box-shadow: 0 4px 15px rgba(255, 249, 196, 0.4);
        }
        .wrap { max-width: 980px; margin: 0 auto; padding: 24px 18px 80px; }
        .top { display:flex; align-items:center; justify-content:space-between; gap:12px; }
        .title { font-size: 18px; font-weight: 700; }
        .nav a { text-decoration:none; color:#444; background:#fff; padding:8px 14px; border-radius:16px; border:1px solid rgba(0,0,0,0.06); font-size:13px; }
        .nav a + a { margin-left: 8px; }

        .section-title { margin: 22px 0 14px; font-size: 15px; font-weight: 700; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }
        .card {
            background: #fff;
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid #f0f0f0;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card:hover { transform: translateY(-4px); box-shadow: 0 12px 22px rgba(0,0,0,0.06); }
        .img { width:100%; aspect-ratio: 1 / 1.05; background:#fafafa; overflow:hidden; }
        .img img { width:100%; height:100%; object-fit:cover; display:block; }
        .info { padding: 14px; }
        .name { font-size: 14px; font-weight: 500; margin-bottom: 8px; height: 40px; overflow: hidden; }
        .price { font-size: 16px; font-weight: 700; color:#333; }
        .empty {
            background:#fff;
            border:1px dashed rgba(0,0,0,0.15);
            border-radius: 18px;
            padding: 22px;
            text-align:center;
            color:#777;
        }
        .btn {
            margin-top: 12px;
            display:inline-block;
            text-decoration:none;
            background:#FDD835;
            color:#444;
            font-weight:700;
            padding:10px 16px;
            border-radius: 18px;
        }
    </style>
</head>
<body>

<header>
    <div class="wrap" style="padding: 0 18px;">
        <div class="top">
            <div class="title" th:text="${memberName} + ' 님의 마이페이지'">마이페이지</div>
            <div class="nav">
                <a href="/">메인</a>
                <a href="/members/logout">로그아웃</a>
            </div>
        </div>
    </div>
</header>

<div class="wrap">
    <div class="section-title">찜 목록</div>

    <div th:if="${#lists.isEmpty(wishlist)}" class="empty">
        아직 찜한 상품이 없어요.
        <div><a class="btn" href="/">상품 보러가기</a></div>
    </div>

    <div class="grid" th:if="${!#lists.isEmpty(wishlist)}">
        <div class="card" th:each="w : ${wishlist}">
            <a th:href="@{'/products/' + ${w.product.id}}" style="text-decoration:none; color:inherit;">
                <div class="img">
                    <img th:src="${(w.product.productImgFiles != null && !#lists.isEmpty(w.product.productImgFiles)) ? w.product.productImgFiles[0].imgUrl : '/images/no-image.jpg'}" alt="상품이미지">
                </div>
                <div class="info">
                    <div class="name" th:text="${w.product.pName}">상품명</div>
                    <div class="price" th:text="${#numbers.formatInteger(w.product.price, 3, 'COMMA') + '원'}">0원</div>
                </div>
            </a>
        </div>
    </div>

    <div class="section-title" style="margin-top: 34px;">장바구니</div>

    <div th:if="${#lists.isEmpty(cartItems)}" class="empty">
        장바구니가 비어 있어요.
        <div><a class="btn" href="/">상품 보러가기</a></div>
    </div>

    <div class="grid" th:if="${!#lists.isEmpty(cartItems)}">
        <div class="card" th:each="ci : ${cartItems}">
            <a th:href="@{'/products/' + ${ci.product.id}}" style="text-decoration:none; color:inherit;">
                <div class="img">
                    <img th:src="${(ci.product.productImgFiles != null && !#lists.isEmpty(ci.product.productImgFiles)) ? ci.product.productImgFiles[0].imgUrl : '/images/no-image.jpg'}" alt="상품이미지">
                </div>
                <div class="info">
                    <div class="name" th:text="${ci.product.pName}">상품명</div>
                    <div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
                        <div class="price" th:text="${#numbers.formatInteger(ci.product.price, 3, 'COMMA') + '원'}">0원</div>
                        <div style="font-size:13px; color:#666;" th:text="${'수량 ' + ci.quantity}">수량 1</div>
                    </div>
                </div>
            </a>
        </div>
    </div>
</div>

</body>
</html>
